name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  CARGO_TERM_COLOR: always
  PRODUCT_SLUG: cszip
  API_BASE_URL: https://20f08p2m-3001.brs.devtunnels.ms
  R2_PREFIX: releases/${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            suffix: linux-x86_64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            suffix: linux-x86_64-musl

          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
            suffix: macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            suffix: macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Normalize version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/cszip.exe" dist/
          else
            cp "target/${{ matrix.target }}/release/cszip" dist/
          fi
          cp README.md dist/
          cp LICENSE dist/

      - name: Create archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SUFFIX: ${{ matrix.suffix }}
          EXT: ${{ matrix.ext }}
        run: |
          PACKAGE_NAME="cszip-${VERSION}-${SUFFIX}.${EXT}"
          cd dist
          if [[ "$EXT" == "zip" ]]; then
            7z a "../${PACKAGE_NAME}" *
          else
            tar -czf "../${PACKAGE_NAME}" *
          fi
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV

      - name: Upload to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          python -m pip install awscli
          aws s3 cp "${PACKAGE_NAME}" \
            "s3://${{ secrets.R2_BUCKET_NAME }}/${{ env.R2_PREFIX }}/${PACKAGE_NAME}" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-disposition "attachment; filename=${PACKAGE_NAME}"

      - name: Generate metadata
        shell: bash
        run: |
          mkdir -p release-meta
          SHA256=$(python3 -c "import hashlib; print(hashlib.sha256(open('${PACKAGE_NAME}','rb').read()).hexdigest())")
          SIZE_BYTES=$(python3 -c "import os; print(os.path.getsize('${PACKAGE_NAME}'))")
          cat > "release-meta/${PACKAGE_NAME}.json" <<EOF
          {
            "fileKey": "${{ env.R2_PREFIX }}/${PACKAGE_NAME}",
            "fileName": "${PACKAGE_NAME}",
            "sizeBytes": $SIZE_BYTES,
            "sha256": "$SHA256",
            "contentType": "application/octet-stream"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.target }}
          path: release-meta/*.json
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: release-meta
          merge-multiple: true

      - name: Build manifest
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y jq

          VERSION="${{ github.ref_name }}"
          NORMALIZED_VERSION="${VERSION#v}"
          CHANNEL="stable"
          if [[ "$NORMALIZED_VERSION" == *"-alpha."* ]]; then CHANNEL="alpha"; fi
          if [[ "$NORMALIZED_VERSION" == *"-beta."* ]]; then CHANNEL="beta"; fi
          if [[ "$NORMALIZED_VERSION" == *"-rc."* ]]; then CHANNEL="rc"; fi

          jq -s \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg repository "${{ github.repository }}" \
            --arg tag "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg workflowRunId "${{ github.run_id }}" \
            '{
              version: $version,
              channel: $channel,
              changelog: "Release generated automatically from GitHub Actions.",
              source: {
                provider: "github",
                repository: $repository,
                tag: $tag,
                commit: $commit,
                workflowRunId: $workflowRunId
              },
              artifacts: .
            }' release-meta/*.json > manifest.json

          echo "Manifest:"
          cat manifest.json

      - name: Notify ConvertSystems
        shell: bash
        run: |
          curl -X POST "${{ env.API_BASE_URL }}/api/v1/products/${{ env.PRODUCT_SLUG }}/github-upload-callback" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CONVERTSYSTEMS_GITHUB_UPLOAD_TOKEN }}" \
            -H "X-GitHub-Repository: ${{ github.repository }}" \
            -H "X-GitHub-Tag: ${{ github.ref_name }}" \
            -H "X-GitHub-Commit: ${{ github.sha }}" \
            --data-binary "@manifest.json" \
            --fail

  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch: Cargo.toml has $VERSION but tag is $TAG"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_TOKEN }}
        continue-on-error: true
